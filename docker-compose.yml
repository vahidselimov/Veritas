services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: veritas_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas_secret
      POSTGRES_DB: veritas_corpus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas_corpus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
