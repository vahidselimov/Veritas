<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- VERITAS Favicon (Precision Reticle + Monogram) -->
  <rect width="64" height="64" fill="#0E0E10" rx="0"/>
  
  <!-- Subtle Internal Grid Gridline -->
  <line x1="32" y1="0" x2="32" y2="64" stroke="#1F1F23" stroke-width="1"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#1F1F23" stroke-width="1"/>

  <!-- Optical 4-Corner L-Brackets (Swiss Amber) -->
  <path d="M 4 14 L 4 4 L 14 4" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="square" fill="none"/>
  <path d="M 50 4 L 60 4 L 60 14" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="square" fill="none"/>
  <path d="M 60 50 L 60 60 L 50 60" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="square" fill="none"/>
  <path d="M 14 60 L 4 60 L 4 50" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="square" fill="none"/>

  <!-- Geometric Sharp 'V' Monogram -->
  <path d="M 16 18 L 32 46 L 48 18" stroke="#F4F4F5" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>

  <!-- Grounding Optical Anchor Target (Amber Dot) -->
  <circle cx="32" cy="46" r="3" fill="#F59E0B"/>
  <line x1="32" y1="12" x2="32" y2="16" stroke="#F59E0B" stroke-width="2"/>
</svg>