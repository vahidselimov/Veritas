<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none">
  <!-- VERITAS // CORPUS Brandmark & Logotype -->
  <rect width="420" height="96" fill="#0E0E10" rx="0"/>
  
  <!-- Icon Mark Container -->
  <g transform="translate(18, 16)">
    <!-- Outer Viewfinder / Frame Box -->
    <rect x="0" y="0" width="64" height="64" fill="#131316" stroke="#27272A" stroke-width="1.5"/>
    
    <!-- Optical Reticle Corner Brackets (Amber) -->
    <path d="M 0 12 L 0 0 L 12 0" stroke="#F59E0B" stroke-width="2" fill="none"/>
    <path d="M 52 0 L 64 0 L 64 12" stroke="#F59E0B" stroke-width="2" fill="none"/>
    <path d="M 64 52 L 64 64 L 52 64" stroke="#F59E0B" stroke-width="2" fill="none"/>
    <path d="M 12 64 L 0 64 L 0 52" stroke="#F59E0B" stroke-width="2" fill="none"/>
    
    <!-- Central Geometric Precision 'V' Monogram -->
    <path d="M 16 18 L 32 48 L 48 18" stroke="#F4F4F5" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
    
    <!-- Sub-quadratic Precision Reticle Cross / Anchor Dot -->
    <circle cx="32" cy="48" r="2.5" fill="#F59E0B"/>
    <line x1="32" y1="12" x2="32" y2="18" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="10" y1="32" x2="16" y2="32" stroke="#71717A" stroke-width="1"/>
    <line x1="48" y1="32" x2="54" y2="32" stroke="#71717A" stroke-width="1"/>
  </g>

  <!-- Typography: VERITAS // CORPUS -->
  <!-- Wordmark -->
  <text x="100" y="44" fill="#F4F4F5" font-family="'Space Grotesk', 'Geist', 'Inter', -apple-system, monospace" font-size="24" font-weight="700" letter-spacing="1.5">VERITAS</text>
  <text x="214" y="44" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="22" font-weight="400" letter-spacing="0.5">//</text>
  <text x="238" y="44" fill="#A1A1AA" font-family="'Space Grotesk', 'Geist', 'Inter', sans-serif" font-size="24" font-weight="500" letter-spacing="2">CORPUS</text>

  <!-- Tagline / Telemetry Subtitle -->
  <text x="102" y="66" fill="#71717A" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="10" font-weight="500" letter-spacing="1.2">GROUNDED DEEP RESEARCH AI · SYS_REV 4.2</text>

  <!-- Status Ping Pill -->
  <rect x="356" y="24" width="46" height="18" fill="#18181B" stroke="#27272A" stroke-width="1"/>
  <circle cx="365" cy="33" r="2.5" fill="#10B981"/>
  <text x="373" y="36.5" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">PROD</text>
</svg>